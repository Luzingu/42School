services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: aluzingu/nginx
    ports: 
      - 80:80
      - 443:443
    container_name: nginx
    #volumes:
      #- /home/aluzingu/data/site:/var/www/html
    networks:
      - iception_network

  php_fpm:
    build:
      context: ./php_fpm
      dockerfile: Dockerfile
    image: aluzingu/php_fpm
    container_name: php_fpm
    networks:
      - iception_network
    #volumes:
      #- /home/aluzingu/data/site:/var/www/html
    ports:
      - 9000:9000
    environment:
      userDb: ${userDb1}
      passDb: ${passDb1}
      dbName: ${dbName}
      siteTile: ${siteTile}
      siteUserAdmin: ${siteUserAdmin}
      sitePassAdmin: ${sitePassAdmin}
      siteAdminEmail: ${siteAdminEmail}

  mariadb:
    build:
      context: ./mariadb
      dockerfile: Dockerfile
    image: aluzingu/mariadb
    container_name: mariadb
    volumes:
      - /home/aluzingu/data/db:/var/lib/mysql
    networks:
      - iception_network
    ports:
      - 3306:3306
    environment:
      userDb1: ${userDb1}
      passDb1: ${passDb1}
      userDb2: ${userDb2}
      passDb2: ${passDb2}
      dbName: ${dbName}
networks:
  iception_network:
    driver: bridge